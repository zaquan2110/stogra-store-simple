# STOGRA STORE — Netlify configuration
# Static HTML site: index.html is served from the repository root.
[build]
  publish = "."

# Basic security headers; no Content-Security-Policy is imposed so configured
# Supabase/CDN/OAuth integrations are not accidentally blocked.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Ensure updated HTML is checked after a deployment instead of remaining stale.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
